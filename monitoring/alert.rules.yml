groups:
- name: nodejs_alerts
  rules:
  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: High HTTP 5xx Error Rate detected
      description: The backend is returning > 5% 5xx errors over the last 5 minutes.
