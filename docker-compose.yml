version: '3.8'

services:
  nginx:
    image: ghcr.io/syedkareem221103-bit/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wimb_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wimb_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3

  backend:
    image: ghcr.io/syedkareem221103-bit/backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wimb_backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wimb_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/v1/system/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: wimb_db
    environment:
      - POSTGRES_USER=${DB_USER:-wimb_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-wimb_password}
      - POSTGRES_DB=${DB_NAME:-wimb_production}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - wimb_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wimb_user} -d ${DB_NAME:-wimb_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wimb_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - wimb_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  wimb_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
