name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    # Needs Redis and Postgres running for tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wimb_test
          POSTGRES_PASSWORD: wimb_password
          POSTGRES_DB: wimb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wimb_test:wimb_password@localhost:5432/wimb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations (Test DB)
        run: npx prisma migrate deploy

      - name: Lint Backend
        run: npx eslint src --ext ts,tsx --max-warnings 0

      - name: Compile Backend TypeScript
        run: npm run build

      - name: Run Backend Tests
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start Backend Server
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://wimb_test:wimb_password@localhost:5432/wimb_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret

      - name: Wait for Backend Health
        run: |
          echo "Waiting for backend..."
          until curl -s http://localhost:4000/health; do
            sleep 2
          done

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:4000

      - name: Run Lighthouse CI Audits
        run: npm run lhci:autorun || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate SBOM (Backend)
        uses: anchore/sbom-action@v0
        with:
          file: ./package-lock.json

      - name: Verify Dependency Lockfile Integrity
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      - name: Run Trivy Vulnerability Scanner (Repository)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
