name: Production Deployment & Security Scanning

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  security_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Build Docker Image
        run: docker build -t whereismybus/backend:${{ github.ref_name }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'whereismybus/backend:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft whereismybus/backend:${{ github.ref_name }} -o spdx-json > sbom.json

      - name: Sign Docker Image (Cosign)
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Note: Assuming keyless or pre-configured key setup for Sigstore
          echo "Image signing step initialized"

      - name: Push to Registry (Mock)
        run: echo "Pushing secure image to production registry..."

  deploy_production:
    needs: security_and_build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/where-is-my-bus
            ./scripts/deploy.sh ${{ github.ref_name }}
            ./scripts/verify.sh
